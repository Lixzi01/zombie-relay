databases:
  - name: lumi-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
services:
  - type: web
    name: lumi-ai-app
    runtime: node
    plan: free
    region: singapore
    branch: lumi-ai
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumi-db
          property: connectionString

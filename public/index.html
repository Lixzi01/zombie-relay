<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f11">
<title>LUMI AI — โรลเพลย์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#0f0f11;--p1:#19191d;--p2:#232328;--line:#2c2c33;--ink:#f2f0ee;--mut:#8e8c93;
  --a1:#ff5a1f;--a2:#ffa24a;--grad:linear-gradient(135deg,var(--a1),var(--a2));--act:#ffc79a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto;position:relative}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:0 16px 110px}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px;letter-spacing:.5px}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-style:normal;font-size:18px;color:#fff}
.me{width:42px;height:42px;border-radius:50%;background:var(--p2);display:grid;place-items:center;font-size:18px;overflow:hidden}
.hero{border-radius:18px;padding:18px 20px;background:radial-gradient(120% 140% at 100% 0%,#ff7a2f55,transparent 60%),linear-gradient(135deg,#2a1a12,#17120f);border:1px solid #3a2a20;margin-bottom:18px}
.hero b{font-size:18px}.hero div{color:#d8c9bd;font-size:14px;margin-top:4px}
.searchrow{display:flex;gap:10px;margin-bottom:14px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:14px;padding:0 14px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:15px;padding:13px 0}
.dice{width:50px;border-radius:14px;background:var(--grad);font-size:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:14px}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
h3{font-size:19px;margin:6px 0 12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px 10px}
.card{text-align:left;min-width:0}
.pic{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--p2)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:46px}
.badge{position:absolute;left:8px;bottom:8px;background:#000a;backdrop-filter:blur(6px);border-radius:999px;padding:2px 8px;font-size:11.5px}
.mine{position:absolute;left:8px;top:8px;background:var(--grad);border-radius:999px;padding:1px 8px;font-size:11px;color:#fff;font-weight:600}
.card .nm{font-weight:700;font-size:14.5px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tg{color:var(--mut);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
/* nav */
.nav{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:#1b1b20ee;backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:26px;display:flex;justify-content:space-around;padding:8px;z-index:5}
.nav button{flex:1;padding:8px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut)}
.nav button span{font-size:20px;line-height:1}
.nav button.on{color:var(--a2);background:#ff5a1f1f}
.nav .plus span{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:24px}
/* form */
.bar{display:flex;align-items:center;gap:8px;padding:12px 10px}
.bar .t{flex:1;font-weight:700;font-size:17px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.iconbtn:hover{background:var(--p2)}
.up{display:flex;gap:14px;align-items:flex-end}
.up .pic{width:120px;flex-shrink:0;cursor:pointer;border:2px dashed var(--line)}
.up .pic .ph{font-size:13px;color:var(--mut);text-align:center;padding:8px}
label{display:block;font-size:13px;color:var(--mut);margin:16px 0 6px}
label small{color:#5f5d64}
.in,textarea.in{width:100%;background:var(--p1);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit;font-size:15px;outline:none}
.in:focus{border-color:var(--a1)}
textarea.in{resize:vertical;min-height:84px;line-height:1.55}
.btn{background:var(--grad);color:#fff;border-radius:999px;padding:12px 22px;font-weight:700}
.btn2{border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;color:var(--ink)}
.btn2.ai{border-color:#ff8a3d66;color:var(--a2)}
.btn:disabled,.btn2:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags .chip{padding:6px 12px;font-size:13px}
/* chat */
#vChat{position:relative}
.chatbg{position:absolute;inset:0;background-size:cover;background-position:center top;filter:blur(3px) brightness(.38);transform:scale(1.04);z-index:0}
.chatbg::after{content:'';position:absolute;inset:0;background:linear-gradient(#0f0f1180,#0f0f11cc 70%,#0f0f11)}
#vChat>*:not(.chatbg){position:relative;z-index:1}
.chead{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #ffffff12;background:#0f0f11aa;backdrop-filter:blur(10px)}
.chead .av{cursor:pointer;width:42px;height:42px;border:2px solid var(--a1);border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--p2)}
.chead .av img{width:100%;height:100%;object-fit:cover}.chead .av .ph{font-size:20px}
.chead .nm{font-weight:700}.chead .tg{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;overflow-y:auto;padding:16px 12px 10px}
.wrap{display:flex;flex-direction:column;gap:14px}
.intro{text-align:center;padding:8px 6px 4px}
.intro .big{width:96px;height:128px;margin:0 auto 10px;border-radius:14px;overflow:hidden;background:var(--p2)}
.intro .big img{width:100%;height:100%;object-fit:cover}
.intro .sc{color:#cfc8c2;font-size:13.5px;font-style:italic;line-height:1.65;max-width:520px;margin:0 auto}
.m{max-width:86%;line-height:1.75;font-size:15.5px;word-wrap:break-word}
.m.user{align-self:flex-end;background:var(--grad);color:#fff;padding:9px 14px;border-radius:18px 18px 4px 18px;white-space:pre-wrap}
.aiwrap{align-self:stretch;display:flex;flex-direction:column;gap:6px;max-width:100%}
.aihead{display:flex;align-items:center;gap:8px;cursor:pointer}
.aihead .av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--p2);border:2px solid #ffffff22;flex-shrink:0}
.aihead .av img{width:100%;height:100%;object-fit:cover}.aihead .av .ph{font-size:17px}
.aihead b{font-size:14px}.aihead span{font-size:11px;color:var(--mut);background:#ffffff12;border-radius:6px;padding:1px 7px}
.m.ai{max-width:100%;background:#1f1f25e8;backdrop-filter:blur(6px);border:1px solid #ffffff12;padding:12px 16px;border-radius:4px 18px 18px 18px;color:#dedbe4}
.m.ai .say{border-left:3px solid var(--a2);padding:2px 0 2px 12px;color:#fff;margin:.6em 0}
.relbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0f0f11b0;backdrop-filter:blur(8px);border-bottom:1px solid #ffffff10;font-size:13px}
.relbar .lv{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.meter{flex:1;height:18px;border-radius:999px;background:#ffffff14;position:relative;overflow:hidden;min-width:60px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .6s}
.meter b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;text-shadow:0 1px 2px #000}
.meter.aff i{background:linear-gradient(90deg,#b07a63,#ff5a6e)}.meter.tru i{background:linear-gradient(90deg,#3a55c8,#6fa0ff)}
.bump{animation:bump .6s}@keyframes bump{50%{transform:scale(1.08)}}
details.st{margin:-2px 0 10px;border-radius:10px;overflow:hidden;border:1px solid #a78bfa44}
details.st summary{list-style:none;cursor:pointer;padding:9px 12px;background:linear-gradient(90deg,#8b6fc4cc,#5d4a8acc);font-size:13.5px;font-weight:600;display:flex;justify-content:space-between}
details.st summary::-webkit-details-marker{display:none}details.st summary::after{content:'▾'}details.st[open] summary::after{content:'▴'}
details.st div{padding:8px 12px;font-size:13px;line-height:1.6;background:#ffffff08;color:#d6d0e4}
.prof{text-align:center}.prof .big{width:180px;aspect-ratio:3/4;margin:0 auto 12px;border-radius:16px;overflow:hidden;background:var(--p2)}
.prof .big img{width:100%;height:100%;object-fit:cover}.prof .big .ph{font-size:70px}
.prof .ds{color:var(--mut);font-size:14px;line-height:1.6;text-align:left;margin-top:12px;white-space:pre-wrap}
.m.ai p{margin:.35em 0}.m.ai em{color:var(--act)}
.m.err{align-self:center;color:#ff9b9b;font-size:13.5px;text-align:center}

.mtools{display:flex;gap:6px;margin-top:-6px}
.mtools button{font-size:12.5px;color:var(--mut);padding:4px 10px;border-radius:999px;background:#ffffff0d}
.typing{color:var(--mut);font-size:14px}
.typing::after{content:"";animation:d 1.2s steps(4) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.composer{padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0f0f11 40%)}
.composer form{display:flex;align-items:flex-end;gap:8px;background:#1c1c21;border:1px solid var(--line);border-radius:24px;padding:6px 6px 6px 14px}
.composer textarea{flex:1;border:none;outline:none;resize:none;background:none;color:var(--ink);font:inherit;font-size:16px;line-height:1.5;max-height:150px;padding:7px 0}
.act{width:40px;height:40px;border-radius:50%;background:#ffffff10;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.send{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex-shrink:0}
.send:disabled{opacity:.35}
/* chats list */
.ci{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ci .av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--p2)}
.ci .av img{width:100%;height:100%;object-fit:cover}.ci .av .ph{font-size:24px}
.ci .tx{flex:1;min-width:0}.ci .nm{font-weight:700}
.ci .lm{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .tm{color:var(--mut);font-size:12px}
/* sheet */
.mask{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--p1);width:100%;max-width:820px;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
.sheet h4{margin:0 0 6px;font-size:17px}
.sheet .opt{display:block;width:100%;text-align:left;padding:14px 6px;border-bottom:1px solid var(--line);font-size:15px}
.sheet .opt.red{color:#ff8b8b}
.seg{display:flex;background:var(--p2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--grad);color:#fff;font-weight:600}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2a2a31;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}

/* ---- icons ---- */
.ic{width:1.2em;height:1.2em;vertical-align:-.22em;flex-shrink:0;display:inline-block}
.nav button span .ic{width:24px;height:24px;vertical-align:0}
.nav button.on span .ic path,.tab.on .ic path,.slide .ic path{fill:url(#lg)}
.tab.on .ic path{fill:#fff}
.nav .plus span .ic{width:24px;height:24px;color:#fff}
.coin .ic,.ic.gold,.bigic .ic{color:#ffc94a}.ic.red{color:#ff5a6e}.verified .ic{color:#5aa9ff;width:1em;height:1em}
.bigic .ic{width:58px;height:58px}
.bell .ic{width:21px;height:21px}
.iconbtn .ic{width:24px;height:24px}
.search .ic{color:var(--mut)}.dice .ic{width:26px;height:26px;color:#fff}
h3 .ic{color:var(--a2)}
.mi span .ic{width:22px;height:22px;color:var(--a2)}
.opt .ic{color:var(--a2);margin-right:4px}.opt.red .ic{color:#ff8b8b}
.tools2 button .ic{width:22px;height:22px}
.send .ic{width:20px;height:20px}
.rank .no .ic{width:26px;height:26px}.rank .no.t1 .ic{color:#ffd36b}.rank .no.t2 .ic{color:#d9dde6}.rank .no.t3 .ic{color:#e2a271}
.meter .ic{width:13px;height:13px;margin-right:2px}
.relbar .lv .ic{color:var(--a2)}
details.st summary .ic{margin-right:4px}
.mtools .ic{width:15px;height:15px}
.ph .ic{width:28px;height:28px;color:var(--mut)}
.mchip{flex:1.6!important;font-size:12.5px!important;background:linear-gradient(135deg,#ff5a1f33,#ffa24a22)!important;color:var(--a2)!important;border:1px solid #ff8a3d55!important;white-space:nowrap}
.mchip .ic{width:16px!important;height:16px!important}
.mdl{display:block;width:100%;text-align:left;background:var(--p2);border:2px solid transparent;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.mdl.on{border-color:var(--a1);background:#1d1714}
.mdl .mh{display:flex;justify-content:space-between;align-items:center}.mdl .mh b{font-size:16px}
.mdl .free{color:#ffd36b;font-size:13px;font-weight:700}
.mdl .md{color:#b9b4c0;font-size:13.5px;line-height:1.6;margin:6px 0 8px}
.mdl .mt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}
.mdl .tg{font-style:normal;padding:3px 10px;border-radius:999px;margin-left:6px;font-weight:700;color:#fff;font-size:12px}
.mdl .tg.b{background:#3b82f6}.mdl .tg.o{background:#f59e0b}.mdl .tg.p{background:#a855f7}
/* ---- v3 additions ---- */
.top .right{display:flex;gap:8px;align-items:center}
.coin{display:flex;align-items:center;gap:6px;background:#2a2312;border:1px solid #4a3c18;color:#ffd36b;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
.bell{position:relative;width:40px;height:40px;border-radius:50%;background:var(--p2);display:grid;place-items:center;font-size:17px}
.bell i{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:#ff3b3b;font-size:10px;font-style:normal;display:grid;place-items:center;padding:0 4px}
.banner{position:relative;border-radius:18px;overflow:hidden;margin-bottom:16px;height:118px}
.slide{position:absolute;inset:0;padding:18px 20px;opacity:0;transition:opacity .6s;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.slide.on{opacity:1}.slide b{font-size:18px}.slide div{color:#e5d9cf;font-size:13.5px;margin-top:4px;max-width:75%}
.slide .big{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.95}.slide .big .ic{width:72px;height:72px}
.dots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:5px}.dots i{width:6px;height:6px;border-radius:3px;background:#ffffff55}.dots i.on{width:18px;background:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:10px 18px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:15px}
.tab.on{background:var(--grad);border-color:transparent;color:#fff}
.ptabs{display:flex;gap:4px;margin:0 0 12px}.ptabs button{padding:6px 12px;border-radius:10px;color:var(--mut);font-size:14px}.ptabs button.on{background:var(--p2);color:var(--a2);font-weight:700}
.sec{margin-bottom:22px}
.rank{display:flex;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rank .no{width:26px;text-align:center;font-weight:700;font-size:17px;color:var(--mut)}.rank .no.t1{color:#ffd36b}.rank .no.t2{color:#d9dde6}.rank .no.t3{color:#e2a271}
.rank .th{width:54px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--p2)}.rank .th img{width:100%;height:100%;object-fit:cover}.rank .th .ph{font-size:24px}
.rank .tx{flex:1;min-width:0}.rank .nm{font-weight:700}.rank .sm{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .st2{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}
.uav{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--p2);display:grid;place-items:center;font-weight:700;flex-shrink:0}.uav img{width:100%;height:100%;object-fit:cover}
.verified{color:#5aa9ff;font-size:12px}
.badge.wl{left:auto;right:8px;top:8px;bottom:auto;background:#5d4a8acc}
.card .by{color:#6f6c75;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.ck div{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:10px 2px;text-align:center;font-size:12px;color:var(--mut)}
.ck div b{display:block;color:#ffd36b;font-size:15px;margin-top:4px}.ck div.done{background:#2a2312;border-color:#6b5520}.ck div.now{border-color:var(--a2);box-shadow:0 0 0 2px #ff8a3d55}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px}
.mi span{font-size:20px;width:26px;text-align:center}
.castrow{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.castrow .row{flex-wrap:nowrap}
.tools2{display:flex;gap:2px;justify-content:space-between;padding:6px 4px 0}
.tools2 button{flex:1;padding:7px 0;border-radius:10px;color:#b8b4bf;font-size:15px;font-weight:600}
.tools2 button:active{background:#ffffff10}
.attach{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:12.5px;color:var(--mut)}
.attach img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.m.user img.sent{display:block;max-width:180px;border-radius:10px;margin-bottom:6px}
.disc{text-align:center;color:#6f6c75;font-size:11px;padding-top:6px}
body.full .chead,body.full .relbar{display:none}
.memo{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.memo div{flex:1;line-height:1.5}.memo button{color:var(--mut)}
.likebtn{border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.likebtn.on{background:#ff3b5c22;border-color:#ff3b5c;color:#ff8fa3}
.mode{font-size:11px;color:var(--mut);text-align:center;margin-top:-6px;margin-bottom:10px}
.off{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a1f"/><stop offset="1" stop-color="#ffc24a"/></linearGradient></defs></svg>
<div class="app">

<!-- HOME -->
<section class="view on" id="vHome">
  <div class="top">
    <div class="logo"><i>✦</i>LUMI</div>
    <div class="right">

/* ===== AI providers ===== */
function dataBlob(url){const [h,b]=url.split(','),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'})}
async function httpErr(res){let j={};try{j=await res.json()}catch(e){}
  const msg=(j.error&&(j.error.message||j.error))||j.message||('HTTP '+res.status);
  return {code:res.status===429?'rate_limited':(res.status===401||res.status===403||/api key|API_KEY/i.test(msg))?'badkey':'http',message:String(msg)}}
async function sse(res,onData){const r=res.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const {done,value}=await r.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(line.startsWith('data:')){const d=line.slice(5).trim();if(d==='[DONE]')return;let j;try{j=JSON.parse(d)}catch(e){continue}onData(j)}}}}
function merged(msgs){const out=[];msgs.forEach(m=>{const l=out[out.length-1];if(l&&l.role===m.role)l.content+='\n\n'+m.content;else out.push({role:m.role,content:m.content})});return out}
async function llm(msgs,system,o={}){
  const p=curProv();
  if(p==='claude'){const s=await sampleP;if(!s)throw{code:'noclaude'};
    const out=merged([{role:'user',content:system+'\n\n[เริ่ม]'},...msgs]);
    const opt={cache:false,signal:o.signal,modelTier:o.tier||cfg.tier,onText:({text})=>{if(text&&text!=='Thinking...'&&o.onText)o.onText(text)}};
    if(o.image)opt.images=[dataBlob(o.image)];
    return (await s(out,opt)).text}
  if(p==='gemini'){if(!cfg.gKey)throw{code:'nokey'};if(!cfg.gModel)await pickDefaultGemini();
    const contents=merged(msgs).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
    if(!contents.length||contents[0].role==='model')contents.unshift({role:'user',parts:[{text:'(เริ่ม)'}]});
    if(o.image)contents[contents.length-1].parts.push({inlineData:{mimeType:'image/jpeg',data:o.image.split(',')[1]}});
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/${cfg.gModel}:streamGenerateContent?alt=sse`,{method:'POST',signal:o.signal,
      headers:{'Content-Type':'application/json','x-goog-api-key':cfg.gKey},
      body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:{temperature:o.json?.7:(o.temp||1)}})});
    if(!res.ok)throw await httpErr(res);
    let text='',why='';await sse(res,d=>{const c=d.candidates&&d.candidates[0];if(c&&c.finishReason&&c.finishReason!=='STOP')why=c.finishReason;
      const t=((c&&c.content&&c.content.parts)||[]).filter(x=>!x.thought).map(x=>x.text||'').join('');if(t){text+=t;o.onText&&o.onText(text)}});
    if(!text)throw{message:'โมเดลไม่ตอบ'+(why?' ('+why+')':'')};return text}
  if(p==='openrouter'||p==='lumi'){if(p==='openrouter'&&!cfg.oKey)throw{code:'nokey'};
    const m=[{role:'system',content:system},...merged(msgs)];
    if(o.image){const l=m[m.length-1];l.content=[{type:'text',text:l.content},{type:'image_url',image_url:{url:o.image}}]}
    const res=p==='lumi'?await fetch('/api/ai',{method:'POST',signal:o.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+B.token},body:JSON.stringify({messages:m,temperature:o.json?.7:(o.temp||.95)})})
      :await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',signal:o.signal,
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.oKey,'X-Title':'LUMI AI'},
      body:JSON.stringify({model:cfg.oModel||'openrouter/free',messages:m,stream:true,temperature:o.json?.7:(o.temp||.95)})});
    if(!res.ok)throw await httpErr(res);
    let text='',err=null;await sse(res,d=>{if(d.error){err=d.error;return}const t=d.choices&&d.choices[0]&&d.choices[0].delta&&d.choices[0].delta.content;if(t){text+=t;o.onText&&o.onText(text)}});
    if(err)throw{code:err.code===429?'rate_limited':'http',message:err.message||String(err)};
    if(!text)throw{message:'โมเดลไม่ตอบ ลองใหม่หรือเปลี่ยนโมเดล'};return text}
}
async function listModels(p,key){

    const j=await r.json();return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&!/image|tts|audio|live|embed|vision|robotics|computer/i.test(m.name))

/* ===== CHECK-IN ===== */
function renderCheck(){const {streak,last}=streakInfo(),today=bkk(),yest=bkk(new Date(Date.now()-864e5));
  const done=last===today,run=done?streak:(last===yest?streak:0),pos=done?((run-1)%7):(run%7);
  $('checkBody').innerHTML=`<div class="panel" style="text-align:center"><div class="bigic">${ic('coin')}</div><div style="font-size:30px;font-weight:700;color:#ffd36b">${fmt(coins())}</div><div style="color:var(--mut)">เหรียญของคุณ</div></div>
   <div class="panel"><b>เช็คอินต่อเนื่อง ${run} วัน ${ic('fire')}</b>
   <div class="ck">${CHECKIN.map((n,i)=>`<div class="${(i<pos||(done&&i===pos))?'done':''} ${(!done&&i===pos)?'now':''}">วัน ${i+1}<b>${(i<pos||(done&&i===pos))?'✓':'+'+n}</b></div>`).join('')}</div>
   <button class="btn" id="ckBtn" style="width:100%" ${done?'disabled':''}>${done?'เช็คอินวันนี้แล้ว ✓ มาใหม่พรุ่งนี้':'เช็คอินรับ '+CHECKIN[Math.min(run+1,7)-1]+' เหรียญ'}</button></div>
   <div class="panel" style="font-size:14px;line-height:1.7;color:#cfcad6"><b>ใช้เหรียญทำอะไรได้?</b><br>${ic('refresh')} สุ่มคำตอบใหม่ — 1 เหรียญ<br>${ic('play')} ให้ตัวละครเล่าต่อ — 1 เหรียญ<br>${ic('chat')} แชทปกติ — ฟรี<br><span style="color:var(--mut);font-size:12.5px">ขาดเช็คอินหนึ่งวัน ลำดับจะเริ่มนับวันที่ 1 ใหม่</span></div>`;
  $('ckBtn').onclick=async()=>{try{const g=await doCheckin();toast('🎉 ได้รับ '+g+' เหรียญ!');renderCheck()}catch(e){toast(e.message)}}}

function renderChats(){const el=$('chatList');
  const ids=Object.keys(chats).filter(id=>chats[id].meta&&chats[id].msgs.some(m=>m.role==='user')).sort((a,b)=>chats[b].t-chats[a].t);
  if(!ids.length){el.innerHTML='<div class="empty">ยังไม่มีแชท ลองเลือกตัวละครจากหน้าแรกดูสิ</div>';return}
  el.innerHTML='';ids.forEach(id=>{const h=chats[id],c=h.meta,vis=h.msgs.filter(m=>!m.hidden),last=vis[vis.length-1];
    const d=new Date(h.t),now=new Date();const tm=d.toDateString()===now.toDateString()?d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('th-TH',{day:'numeric',month:'short'});
    const b=document.createElement('button');b.className='ci';
    b.innerHTML=`<div class="av">${picHTML(c)}</div><div class="tx"><div class="nm">${esc(c.name)} ${c.type==='world'?'🌍':''}</div><div class="lm">${esc((last.role==='user'?'คุณ: ':'')+last.content.replace(/\*/g,'').replace(/\n+/g,' '))}</div></div><div class="tm">${tm}</div>`;
    b.onclick=()=>openChat(id);el.appendChild(b)})}

function shrink(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
    res({url:cv.toDataURL('image/jpeg',.82)})};img.onerror=rej;img.src=u})}

/* ===== CHAT ===== */
function hist(){return chats[cur.id]?.msgs||[]}
function mem(){return chats[cur.id]?.mem||[]}
function save(){const o=chats[cur.id]||{};chats[cur.id]={...o,msgs:hist(),mem:mem(),t:Date.now(),meta:{name:cur.name,img:cur.img,emoji:cur.emoji,hue:cur.hue,type:cur.type}};S.set('lumi_chats',chats)}
function rel(){const h=hist();for(let i=h.length-1;i>=0;i--)if(h[i].rel)return h[i].rel;return {aff:0,tru:0}}
function lvl(r){const v=(r.aff+r.tru)/2;return v<8?['🌫️','คนแปลกหน้า']:v<25?['🙂','คนรู้จัก']:v<50?['😊','เพื่อน']:v<75?['🫂','เพื่อนสนิท']:['💞','คนสำคัญ']}
function renderRel(bump){const r=rel(),[e,n]=lvl(r);
  $('relbar').innerHTML=`<div class="lv">${ic('users')} ${n}</div><div class="meter aff${bump?' bump':''}"><i style="width:${r.aff}%"></i><b>${ic('heart')} ${r.aff}</b></div><div class="meter tru${bump?' bump':''}"><i style="width:${r.tru}%"></i><b>${ic('hand')} ${r.tru}</b></div>`}
function splitStatus(t){const i=t.indexOf('<status');if(i<0){const j=t.lastIndexOf('<');return {text:j>t.length-8?t.slice(0,j):t,st:null}}
  const m=t.slice(i).match(/<status>([\s\S]*?)<\/status>/);let st=null;
  if(m){try{st=JSON.parse(m[1].slice(m[1].indexOf('{'),m[1].lastIndexOf('}')+1))}catch(e){}}
  return {text:t.slice(0,i).trim(),st}}
function stHTML(st){if(!st)return '';const row=(k,v)=>v?`<b>${k}</b> ${esc(String(v))}<br>`:'';
  return `<details class="st"><summary><span>${ic('chart')} สถานะปัจจุบัน</span></summary><div>${row(ic('map'),st.place)}${row(ic('mood')+' อารมณ์:',st.mood)}${row(ic('think'),st.note)}</div></details>`}
function sys(c){
  const world=c.type==='world';
  const u=`\n\n## ผู้ใช้ (คู่สนทนา)\n${user.name?'ชื่อ: '+user.name+'\n':''}${c.urole?'บทบาทในเรื่องนี้: '+c.urole+'\n':''}${user.bio?'ข้อมูลเพิ่มเติม: '+user.bio:''}`;
  const r=rel(),[,lv]=lvl(r);const M=curModel(),novel=M.kind==='novel';
  const who=world?'ผู้เล่าเรื่อง (narrator / game master) ของจักรวาลนี้ และสวมบทเป็นทุกตัวละครในโลก':`"${c.name}"`;

    const c2=chats[id];if(c2&&c2.msgs===h&&out.trim()){c2.sum=out.trim().slice(0,3000);c2.sumTo=to;S.set('lumi_chats',chats)}}catch(e){}
  autoSum.busy=false}
function grow(){const i=$('input');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,150)+'px'}
function updateBtn(){$('send').disabled=busy||(!$('input').value.trim()&&!pendImg)}
$('input').oninput=()=>{grow();updateBtn()};
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(pointer:fine)').matches){e.preventDefault();send()}};
$('form').onsubmit=e=>{e.preventDefault();send()};
function wrapSel(a,b){const i=$('input'),s=i.selectionStart,e=i.selectionEnd,v=i.value;i.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);i.focus();i.selectionStart=i.selectionEnd=e+a.length+(s===e?0:b.length);grow();updateBtn()}
$('tStar').onclick=()=>wrapSel('*','*');$('tQuote').onclick=()=>wrapSel('"','"');
$('tImg').onclick=()=>$('chatFile').click();
$('chatFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{pendImg=(await shrink(f,512)).url;
  $('attach').style.display='flex';$('attach').innerHTML=`<img src="${pendImg}"><span style="flex:1">แนบรูปแล้ว ตัวละครจะมองเห็นรูปนี้</span><button class="iconbtn" id="atX">✕</button>`;$('atX').onclick=clearAttach;updateBtn()}catch(err){toast('เปิดรูปไม่ได้')}};
function clearAttach(){pendImg=null;$('attach').style.display='none';$('attach').innerHTML='';updateBtn()}
$('tMem').onclick=()=>memSheet();
$('tFull').onclick=()=>{document.body.classList.toggle('full');toast(document.body.classList.contains('full')?'โหมดเต็มจอ (กด ⛶ อีกครั้งเพื่อออก)':'ออกจากโหมดเต็มจอ')};
$('tSet').onclick=aiSheet;$('tModel').onclick=modelSheet;
$('chBack').onclick=()=>{if(ctrl)ctrl.abort();back()};
function memSheet(prefill){const L=mem();
  sheet(`<h4>${ic('pin')} ความจำ</h4><div style="color:var(--mut);font-size:13px;margin-bottom:8px">สิ่งที่ปักหมุดไว้ AI จะจำตลอดแชทนี้ แม้คุยกันยาวมาก (สูงสุด 20)</div>
   ${chats[cur.id].sum?`<details class="st" style="margin:4px 0 10px"><summary><span>${ic('book')} เรื่องย่ออัตโนมัติ (V5)</span></summary><div style="white-space:pre-wrap">${esc(chats[cur.id].sum)}</div></details>`:''}
   <div id="memL">${L.map((x,i)=>`<div class="memo"><div>${esc(x)}</div><button data-i="${i}">✕</button></div>`).join('')||'<div class="empty" style="padding:14px">ยังไม่มีความจำ</div>'}</div>
   <textarea class="in" id="memIn" maxlength="300" style="min-height:64px;margin-top:10px" placeholder="เช่น เธอสัญญาว่าจะพาไปดูดาวคืนพรุ่งนี้">${esc(prefill||'')}</textarea>
   <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="memAdd">${ic('pin')} ปักหมุด</button></div>`);
  $('sheet').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{L.splice(+b.dataset.i,1);chats[cur.id].mem=L;save();memSheet()});
  $('memAdd').onclick=()=>{const v=$('memIn').value.trim();if(!v)return;if(L.length>=20)return toast('ความจำเต็มแล้ว ลบอันเก่าก่อน');L.push(v);chats[cur.id].mem=L;save();toast('📌 จำแล้ว');memSheet()}}
async function profile(){const c=cur;
  sheet(`<div class="prof"><div class="big">${picHTML(c)}</div><h4>${esc(c.name)} ${c.type==='world'?'🌍':''}</h4><div style="color:var(--a2);font-size:14px">${esc(c.tag||'')}</div>
  ${c.owner_name?`<div style="margin-top:6px;font-size:13px;color:var(--mut)">สร้างโดย <a href="#" id="pfBy" style="color:var(--ink)">@${esc(c.owner_name)}</a>${c.official?' <span class="verified">'+ic('verified')+'</span>':''}</div>`:''}
  <div style="color:var(--mut);font-size:13px;margin-top:4px">💬 ${fmt(c.chats)} ข้อความ · ${ic('heart')} <span id="pfL">${fmt(c.likes)}</span></div>
  ${(c.cats||[]).length?`<div class="tags" style="justify-content:center;margin-top:10px">${c.cats.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}
  <div class="row" style="justify-content:center;margin-top:12px">${B.on?`<button class="likebtn${c.liked?' on':''}" id="pfLike">${c.liked?'❤️ ถูกใจแล้ว':'🤍 ถูกใจ'}</button>`:''}</div>
  <div class="ds">${esc(c.persona||'')}</div>${(c.cast||[]).length?`<div class="ds"><b>ตัวละครในจักรวาล</b>\n${c.cast.map(x=>'• '+x.name+' — '+x.desc).join('\n')}</div>`:''}</div>
  ${c.mine?'<button class="opt" id="pfEd">'+ic('edit')+' แก้ไข</button><button class="opt red" id="pfDel">'+ic('trash')+' ลบ</button>':''}
  ${B.on&&!c.mine&&!c.official?'<button class="opt red" id="pfRep">'+ic('flag')+' รายงานเนื้อหาไม่เหมาะสม</button>':''}
  <button class="opt" id="pX" style="text-align:center">ปิด</button>`);
  $('pX').onclick=close;
  if($('pfBy'))$('pfBy').onclick=e=>{e.preventDefault();close();if(B.on)openCreator(c.owner)};
  if($('pfLike'))$('pfLike').onclick=async()=>{try{const j=await api('/api/chars/'+c.id+'/like',{method:'POST'});c.liked=j.liked;c.likes=j.likes;$('pfLike').className='likebtn'+(j.liked?' on':'');$('pfLike').textContent=j.liked?'❤️ ถูกใจแล้ว':'🤍 ถูกใจ';$('pfL').textContent=fmt(j.likes)}catch(e){toast(e.message)}};
  if($('pfEd'))$('pfEd').onclick=()=>{close();openEditor(c)};
  if($('pfDel'))$('pfDel').onclick=async()=>{const b=$('pfDel');if(!b.dataset.c){b.dataset.c=1;b.textContent='แตะอีกครั้งเพื่อยืนยันการลบ';return}
    try{await delChar(c.id);close();stack.length=0;show('vHome');toast('ลบแล้ว')}catch(e){toast(e.message)}};
  if($('pfRep'))$('pfRep').onclick=async()=>{try{await api('/api/chars/'+c.id+'/report',{method:'POST',body:{reason:'inappropriate'}});close();toast('ขอบคุณที่รายงาน เราจะตรวจสอบ')}catch(e){toast(e.message)}}}

/* sheets */
function modelSheet(){let sel=curModel().id;
  const draw=()=>{sheet(`<div class="row" style="justify-content:space-between;margin-bottom:8px"><h4 style="margin:0">โมเดลเอไอแนะนำ</h4><button class="iconbtn" id="mdX">${ic('close')}</button></div>
    ${MODELS.map(m=>`<button class="mdl${m.id===sel?' on':''}" data-m="${m.id}"><div class="mh"><b>${m.name}</b><span class="free">ฟรี</span></div><div class="md">${m.desc}</div>
      <div class="mt"><span>${m.v>=5?'ใหม่ล่าสุด':'เวอร์ชันเสถียร'}</span><span>${m.tags.map(t=>`<i class="tg ${t==='ใหม่'?'b':t==='ทดลอง'?'o':'p'}">${t}</i>`).join('')}</span></div></button>`).join('')}
    <button class="btn" id="mdOk" style="width:100%;margin-top:8px">เลือก</button>`);
    $('sheet').querySelectorAll('.mdl').forEach(b=>b.onclick=()=>{sel=b.dataset.m;draw()});
    $('mdX').onclick=close;$('mdOk').onclick=()=>{cfg.model=sel;S.set('lumi_cfg',cfg);close();updModelChip();toast('ใช้โมเดล '+curModel().name)}};draw()}
function updModelChip(){const b=$('tModel');if(b)b.innerHTML=ic('magic')+' '+curModel().name.replace(/^.*?(V\d)$/,(x,v)=>(curModel().kind==='novel'?'นิยาย ':'แชท ')+v)}
function sheet(html){$('sheet').innerHTML=html;$('mask').classList.add('on')}
function close(){$('mask').classList.remove('on')}
$('mask').onclick=e=>{if(e.target.id==='mask')close()};
$('chMenu').onclick=()=>{sheet(`<h4>${esc(cur.name)}</h4>
  <button class="opt" id="o5">${ic('eye')} ดูโปรไฟล์</button>
  <button class="opt" id="o6">${ic('pin')} ความจำ (${mem().length})</button>
  <button class="opt" id="o1">${ic('refresh')} เริ่มเรื่องใหม่ (ล้างแชทนี้)</button>
  <button class="opt" id="o4">ปิด</button>`);
  $('o1').onclick=()=>{const b=$('o1');if(!b.dataset.c){b.dataset.c=1;b.textContent='แตะอีกครั้งเพื่อยืนยัน (ความจำและความสัมพันธ์จะรีเซ็ต)';return}
    if(ctrl)ctrl.abort();delete chats[cur.id];S.set('lumi_chats',chats);close();openChat(cur.id)};
  $('o5').onclick=profile;$('o6').onclick=()=>memSheet();$('o4').onclick=close};
function aiSheet(){const prov=curProv();
  sheet(`<h4>${ic('robot')} ตั้งค่า AI</h4>
  <label>โมเดลการเล่นบทบาท</label><button class="btn2" id="mdlBtn" style="width:100%;text-align:left">${ic('magic')} ${esc(curModel().name)} <span style="color:var(--mut);float:right">เปลี่ยน ›</span></button>
  <label>ผู้ให้บริการ AI</label><div class="seg" id="pSeg" style="flex-wrap:wrap">${B.ai?'<button data-p="lumi">✨ LUMI ฟรี</button>':''}${hasClaude?'<button data-p="claude">Claude</button>':''}<button data-p="gemini">Gemini</button><button data-p="openrouter">OpenRouter</button></div>
  <div id="pBox"></div>
  <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="uS">บันทึก</button></div>`);
  $('mdlBtn').onclick=()=>{grab();Object.assign(cfg,{provider:p,tier,gKey:keys.gemini||'',oKey:keys.openrouter||'',gModel:models.gemini||'',oModel:models.openrouter||'openrouter/free'});S.set('lumi_cfg',cfg);modelSheet()};
  let p=prov,tier=cfg.tier,keys={gemini:cfg.gKey,openrouter:cfg.oKey},models={gemini:cfg.gModel,openrouter:cfg.oModel||'openrouter/free'};
  const box=()=>{document.querySelectorAll('#pSeg button').forEach(b=>{b.classList.toggle('on',b.dataset.p===p);b.onclick=()=>{grab();p=b.dataset.p;box()}});
    const B=$('pBox');
    if(p==='lumi'){B.innerHTML=`<div class="panel" style="margin-top:12px;font-size:13.5px;line-height:1.6;color:#cfcad6">✨ ใช้ AI ฟรีของ LUMI ได้เลย ไม่ต้องใส่ key<br><span style="color:var(--mut)">จำกัด 30 ข้อความ/ชั่วโมง ต่อคน · โมเดลฟรีจะสุ่มสลับกันไป ถ้าอยากเลือกโมเดลเอง ให้ใช้ OpenRouter/Gemini ด้วย key ของคุณ</span></div>`;return}
    if(p==='claude'){B.innerHTML=`<label>โหมด</label><div class="seg" id="tSeg"><button data-t="complex">🧠 ฉลาดสุด</button><button data-t="default">⚡ เร็ว</button></div>
      <div style="color:var(--mut);font-size:12.5px;margin-top:6px">ใช้โควต้าแพ็กเกจ Claude ของคุณ ใช้ได้เฉพาะตอนเปิดผ่าน claude.ai</div>`;
      const ts=()=>document.querySelectorAll('#tSeg button').forEach(b=>{b.classList.toggle('on',b.dataset.t===tier);b.onclick=()=>{tier=b.dataset.t;ts()}});ts();return}
    const g=p==='gemini';
    B.innerHTML=`<label>API key ${g?'จาก aistudio.google.com':'จาก openrouter.ai/keys'}</label>
      <input class="in" id="kIn" type="password" autocomplete="off" value="${esc(keys[p]||'')}" placeholder="วาง key ที่นี่">
      <label>โมเดล</label><div class="row"><select class="in" id="mSel" style="flex:1"><option value="${esc(models[p]||'')}">${esc(models[p]||'(อัตโนมัติ)')}</option></select>
      <button class="btn2" id="mLoad">โหลดรายชื่อ</button></div>
      <div style="color:var(--mut);font-size:12.5px;margin-top:8px;line-height:1.55">${g?'ฟรีแบบจำกัดจำนวนครั้ง · Google อาจนำข้อความในโหมดฟรีไปปรับปรุงบริการ':'โมเดลฟรี (:free) จำกัด ~50 ครั้ง/วัน · โมเดลฟรีเปลี่ยนบ่อย ถ้าตัวไหนพังให้เลือก "สุ่มอัตโนมัติ"'}<br>🔒 key เก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</div>`;
    $('mLoad').onclick=async()=>{grab();const bt=$('mLoad');bt.disabled=true;bt.textContent='กำลังโหลด...';
      try{if(g&&!keys.gemini)throw{code:'nokey'};const l=await listModels(p,keys[p]);
        $('mSel').innerHTML=l.map(m=>`<option value="${esc(m.id)}"${m.id===models[p]?' selected':''}>${esc(m.label)}</option>`).join('');models[p]=$('mSel').value;
        toast('พบ '+l.length+' โมเดล')}catch(e){toast(errText(e))}
      bt.disabled=false;bt.textContent='โหลดรายชื่อ'}};
  const grab=()=>{if($('kIn'))keys[p]=$('kIn').value.trim();if($('mSel'))models[p]=$('mSel').value};
  box();
  $('uS').onclick=()=>{grab();
    Object.assign(cfg,{provider:p,tier,gKey:keys.gemini||'',oKey:keys.openrouter||'',gModel:models.gemini||'',oModel:models.openrouter||'openrouter/free'});
    S.set('lumi_cfg',cfg);checkAiBtn&&checkAiBtn();close();toast('บันทึกแล้ว · ใช้ '+PROV[p])}}

hydrate();updModelChip();boot().then(()=>show('vHome'));
</script>
</body>
</html>
